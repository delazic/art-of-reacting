# nginx config for the web container: serves the built SPA and resolves the
# relative /api/* paths the frontend calls. The browser only ever talks to this
# server — the API container publishes no port.
# See ../docs/architecture.md#same-origin-routing-design-rule

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # `api` is the docker-compose service name, resolved by Docker's embedded
    # DNS on the compose network. It is meaningful only inside that network: it
    # is neither localhost nor the Docker Machine VM's address.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /actuator/* is deliberately NOT proxied. Health is for the container
    # runtime, not for the browser.

    # Vite emits content-hashed asset filenames, so these can be cached hard.
    # One Cache-Control header only — `expires` would emit a second, competing one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or a browser keeps requesting the previous
    # build's hashed asset URLs after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # There is no client-side router, so the fallback only matters for a
    # hand-typed path or a refresh — it keeps those from 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
